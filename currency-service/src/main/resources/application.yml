server:
  port: 8080

spring:
  application:
    name: currency-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Sized for a single Railway replica serving a cache-backed, read-mostly
      # workload: requests hit the in-memory rate/currency caches first and DB
      # queries are short. A small pool avoids exhausting Railway Postgres'
      # connection limit (which one oversized pool, or any future replica,
      # could otherwise do). Revisit only alongside the scaling notes in CLAUDE.md.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: ${LIQUIBASE_ENABLED:true}

api:
  fixer:
    url: https://data.fixer.io/api
  exchangerates:
    url: https://api.exchangeratesapi.io/v1
  currencyapi:
    url: https://api.currencyapi.com/v3
  frankfurter:
    url: https://api.frankfurter.dev/v2

admin:
  api-key: ${ADMIN_API_KEY}

cache:
  exchange-rates:
    ttl: 28800

scheduling:
  enabled: true
  exchange-rates:
    rate: 28800000

exchange-rates:
  base-currency: EUR

encryption:
  master-key: ${ENCRYPTION_MASTER_KEY}

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: https://generativelanguage.googleapis.com/
  model: gemini-3.1-flash-lite-preview
  prompts:
    system: "You are a financial data assistant. You specialize exclusively in bank fees and foreign currency transaction commissions. Refuse any questions not related to bank commission rates."
    bank-commission: "For the bank named '{bankName}', what is the typical foreign currency transaction commission percentage? Return ONLY a single decimal number (e.g. 0.5 or 3.0). If unknown or unsure, return exactly: NOT_FOUND"

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,metrics
  endpoint:
    health:
      # Public callers see only UP/DOWN; component details require ROLE_ADMIN
      # (X-API-Key), so the healthcheck works without leaking internals.
      show-details: when_authorized
      roles: ADMIN
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    enable:
      jvm: false
      process: false
      system: false
      tomcat: false
      logback: false
      executor: false
      spring.security: false
      disk: false
      hikaricp: true
      jdbc: false
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.example.cerpshashkin: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

resilience4j:
  retry:
    instances:
      # The three primary clients serve both the 8h scheduler refresh and the
      # synchronous /currencies/convert fallback path (stale-DB case). The
      # budget is sized for the request path — 2 attempts with a short wait
      # caps worst-case blocking at ~2 read timeouts per provider (was 3
      # attempts x 2s waits) — because the scheduler already has its own
      # retry layers (3 startup attempts, 8h cadence inside the 24h freshness
      # window). Only the listed transient failures are retried, so an
      # open-circuit CallNotPermittedException fails fast.
      fixerClient:
        max-attempts: 2
        wait-duration: 300ms
        retry-exceptions:
          - com.example.cerpshashkin.exception.ExternalApiException
          - org.springframework.web.client.RestClientException
      exchangeRatesClient:
        max-attempts: 2
        wait-duration: 300ms
        retry-exceptions:
          - com.example.cerpshashkin.exception.ExternalApiException
          - org.springframework.web.client.RestClientException
      currencyApiClient:
        max-attempts: 2
        wait-duration: 300ms
        retry-exceptions:
          - com.example.cerpshashkin.exception.ExternalApiException
          - org.springframework.web.client.RestClientException
      frankfurterClient:
        # Short waits so the /rates/historical request path gives up in ~0.6s
        # rather than ~6s (was 2s waits). Only the listed transient failures are
        # retried, so an open-circuit CallNotPermittedException fails fast.
        max-attempts: 3
        wait-duration: 300ms
        retry-exceptions:
          - com.example.cerpshashkin.exception.ExternalApiException
          - org.springframework.web.client.RestClientException
  circuitbreaker:
    instances:
      # Each retry attempt is recorded by the breaker (Retry wraps
      # CircuitBreaker), so with all providers down the breaker opens within
      # ~3 convert requests and later ones fail in microseconds instead of
      # blocking a Tomcat thread on provider timeouts. Median aggregation
      # tolerates an open breaker: the provider just drops out of the fan-out.
      fixerClient:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
      exchangeRatesClient:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
      currencyApiClient:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
      frankfurterClient:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
