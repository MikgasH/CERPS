databaseChangeLog:
  # Each currency gets its own changeset with a MARK_RAN precondition because
  # production may already contain some of these codes, added at runtime via
  # POST /api/v1/admin/currencies — a plain insert would violate the unique
  # constraint and block startup.

  # === CIS / Eastern Partnership ===
  - changeSet:
      id: add-currency-rub
      author: hashkin
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM supported_currencies WHERE currency_code = 'RUB'
      changes:
        - insert:
            tableName: supported_currencies
            columns:
              - column:
                  name: currency_code
                  value: RUB
      rollback:
        - delete:
            tableName: supported_currencies
            where: currency_code = 'RUB'

