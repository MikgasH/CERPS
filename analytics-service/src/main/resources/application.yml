server:
  port: 8082

spring:
  application:
    name: analytics-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: ${LIQUIBASE_ENABLED:true}

currency-service:
  url: ${CURRENCY_SERVICE_URL:http://localhost:8080}

api:
  frankfurter:
    url: https://api.frankfurter.dev/v2

admin:
  api-key: ${ADMIN_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,metrics
  endpoint:
    health:
      # Public callers see only UP/DOWN; analytics has no admin role binding in
      # the security chain, so never expose component details.
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    enable:
      jvm: false
      process: false
      system: false
      tomcat: false
      logback: false
      executor: false
      spring.security: false
      disk: false
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.example.analyticsservice: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

resilience4j:
  retry:
    instances:
      currencyService:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.example.cerps.common.exception.ExternalServiceException
          - org.springframework.web.client.RestClientException
      frankfurter:
        # Short waits so a request-path backfill failure falls back to the
        # legacy currency-service source in ~0.6s instead of ~6s (was 2s waits).
        max-attempts: 3
        wait-duration: 300ms
        retry-exceptions:
          - com.example.cerps.common.exception.ExternalServiceException
          - org.springframework.web.client.RestClientException
  circuitbreaker:
    instances:
      frankfurter:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true

cache:
  trends:
    ttl: 28800
    short-ttl: 300
